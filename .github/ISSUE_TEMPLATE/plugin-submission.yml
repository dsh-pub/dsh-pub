name: Submit a plugin
description: List a public DeepSeek Harness bundle on dsh.pub
title: '[Plugin submission] '
labels:
  - plugin-submission
body:
  - type: markdown
    attributes:
      value: |
        Paste one public GitHub repository. dsh.pub reads its root package metadata, pins the current source, and lists it automatically when the bundle contract is valid. No repository code is executed. Listing is not a human review, security audit, publisher identity check, or official endorsement.

  - type: input
    id: repository
    attributes:
      label: GitHub repository
      description: A public repository URL in https://github.com/owner/repository form.
      placeholder: https://github.com/owner/repository
    validations:
      required: true
