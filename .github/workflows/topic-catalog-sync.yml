name: Topic catalog sync

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/topic-catalog-sync.yml
      - scripts/sync-topic-catalog.mjs
      - scripts/lib/github-topic-client.mjs
      - scripts/lib/topic-catalog-sync.mjs
  schedule:
    - cron: '0 1 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:

permissions: {}

concurrency:
  group: topic-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync dsh-plugin Topic
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: npm
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Sync Topic catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-topic-catalog.mjs

      - name: Run static checks
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Build deployable workspace
        run: npm run build
        env:
          PUBLIC_GA_MEASUREMENT_ID: G-TEST123456

      - name: Create catalog push token
        id: catalog-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.DSH_PUB_APP_CLIENT_ID }}
          permission-contents: write
          private-key: ${{ secrets.DSH_PUB_APP_PRIVATE_KEY_PKCS8 }}

      - name: Commit generated catalog data
        env:
          GH_TOKEN: ${{ steps.catalog-app-token.outputs.token }}
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only)
          if [[ "${#changed[@]}" -eq 0 ]]; then
            echo "Topic catalog is already current."
            exit 0
          fi
          for path in "${changed[@]}"; do
            case "$path" in
              apps/dsh-plugin/lib/client.js) ;;
              apps/dsh-plugin/src/client/catalog.generated.json) ;;
              apps/server/src/installable-slugs.generated.json) ;;
              packages/catalog/src/community.generated.json) ;;
              packages/catalog/src/community.sources.json) ;;
              packages/catalog/src/topic-analysis.generated.json) ;;
              *) echo "Unexpected generated path: $path" >&2; exit 1 ;;
            esac
          done
          git config user.name "dsh.pub catalog bot"
          git config user.email "catalog-bot@dsh.pub"
          git add \
            apps/dsh-plugin/lib/client.js \
            apps/dsh-plugin/src/client/catalog.generated.json \
            apps/server/src/installable-slugs.generated.json \
            packages/catalog/src/community.generated.json \
            packages/catalog/src/community.sources.json \
            packages/catalog/src/topic-analysis.generated.json
          git commit -m "chore(catalog): sync dsh-plugin topic"
          gh auth setup-git
          git push origin HEAD:main

      - name: Install browser for E2E
        run: npx playwright install --with-deps chromium

      - name: Run integration tests
        run: npm run e2e
        env:
          E2E_SKIP_BUILD: '1'
          PUBLIC_GA_MEASUREMENT_ID: G-TEST123456
