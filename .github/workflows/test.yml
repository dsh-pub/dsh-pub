name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Install dependencies
        run: npm ci

      - name: Install browser for E2E
        run: npx playwright install --with-deps chromium

      - name: Run static checks
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Build deployable web app
        run: npm run build -w @dsh-pub/web
        env:
          PUBLIC_GA_MEASUREMENT_ID: G-TEST123456
          PUBLIC_ADSENSE_CLIENT_ID: ca-pub-6970014519897262
          PUBLIC_ADSENSE_SLOT_DETAIL: '1234567890'
          PUBLIC_ADSENSE_SLOT_CATALOG: '0987654321'

      - name: Run integration tests
        run: npm run e2e
        env:
          E2E_SKIP_BUILD: '1'
          PUBLIC_GA_MEASUREMENT_ID: G-TEST123456
          PUBLIC_ADSENSE_CLIENT_ID: ca-pub-6970014519897262
          PUBLIC_ADSENSE_SLOT_DETAIL: '1234567890'
          PUBLIC_ADSENSE_SLOT_CATALOG: '0987654321'

      - name: Upload E2E evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: .cache/test-results/e2e/
          if-no-files-found: ignore
          retention-days: 14
