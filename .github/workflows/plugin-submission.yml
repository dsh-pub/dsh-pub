name: Plugin submission

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - submissions/**
  push:
    branches:
      - main
    paths:
      - submissions/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: plugin-submission-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  validate:
    name: Validate plugin submission
    if: github.event_name == 'pull_request_target' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base_sha: ${{ steps.process.outputs.base_sha }}
      changed: ${{ steps.process.outputs.changed }}
      head_sha: ${{ steps.process.outputs.head_sha }}
      valid: ${{ steps.process.outputs.valid }}

    steps:
      - name: Checkout trusted registry source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Setup environment
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: npm
          node-version: '22'

      - name: Install trusted registry dependencies
        run: npm ci

      - name: Inspect the fixed public source
        id: process
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/process-plugin-submission.mjs

      - name: Generate directory artifacts
        run: npm run build --workspace @dsh-pub/plugin-directory

      - name: Run static checks
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Install browser for E2E
        run: npx playwright install --with-deps chromium

      - name: Run integration tests
        run: npm run e2e

      - name: Build deployable workspace
        run: npm run build

  merge:
    name: Merge validated submission
    needs: validate
    if: needs.validate.outputs.valid == 'true' && needs.validate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Create update-branch token
        id: submission-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.DSH_PUB_APP_CLIENT_ID }}
          permission-contents: write
          permission-pull-requests: write
          private-key: ${{ secrets.DSH_PUB_APP_PRIVATE_KEY_PKCS8 }}

      - name: Merge the validated pull request
        env:
          EXPECTED_BASE_SHA: ${{ needs.validate.outputs.base_sha }}
          EXPECTED_HEAD_SHA: ${{ needs.validate.outputs.head_sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          UPDATE_BRANCH_TOKEN: ${{ steps.submission-app-token.outputs.token }}
        shell: bash
        run: |
          [[ "$EXPECTED_BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          test "$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)" = "$EXPECTED_HEAD_SHA"
          test "$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .base.ref)" = main
          test "$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .draft)" = false
          test "$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .state)" = open
          CURRENT_MAIN_SHA="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          [[ "$CURRENT_MAIN_SHA" =~ ^[a-f0-9]{40}$ ]]
          if [ "$CURRENT_MAIN_SHA" != "$EXPECTED_BASE_SHA" ]; then
            GH_TOKEN="$UPDATE_BRANCH_TOKEN" gh api --method PUT "repos/$REPOSITORY/pulls/$PR_NUMBER/update-branch" \
              -f expected_head_sha="$EXPECTED_HEAD_SHA" >/dev/null
            exit 0
          fi
          test "$(GH_TOKEN="$UPDATE_BRANCH_TOKEN" gh api --method PUT "repos/$REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f sha="$EXPECTED_HEAD_SHA" \
            -f merge_method=merge \
            --jq .merged)" = true

  integrate:
    name: Integrate merged submission
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout merged submission
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}

      - name: Setup environment
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: npm
          node-version: '22'

      - name: Install trusted registry dependencies
        run: npm ci

      - name: Generate catalog from merged submissions
        id: sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-plugin-submissions.mjs

      - name: Run static checks
        if: steps.sync.outputs.changed == 'true'
        run: npm run lint

      - name: Run unit tests
        if: steps.sync.outputs.changed == 'true'
        run: npm run test

      - name: Build deployable workspace
        if: steps.sync.outputs.changed == 'true'
        run: npm run build

      - name: Install browser for E2E
        if: steps.sync.outputs.changed == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run integration tests
        if: steps.sync.outputs.changed == 'true'
        run: npm run e2e

      - name: Create catalog push token
        if: steps.sync.outputs.changed == 'true'
        id: catalog-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.DSH_PUB_APP_CLIENT_ID }}
          permission-contents: write
          private-key: ${{ secrets.DSH_PUB_APP_PRIVATE_KEY_PKCS8 }}

      - name: Commit generated catalog
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.catalog-app-token.outputs.token }}
        shell: bash
        run: |
          git config user.name "dsh.pub catalog bot"
          git config user.email "catalog-bot@dsh.pub"
          git add \
            apps/dsh-plugin/lib/client.js \
            apps/dsh-plugin/src/client/catalog.generated.json \
            apps/server/src/installable-slugs.generated.json \
            packages/catalog/src/community.generated.json \
            packages/catalog/src/community.sources.json
          git commit -m "feat(catalog): integrate merged plugin submission"
          gh auth setup-git
          git push origin HEAD:main
